overlay: 1.0.0
info:
  title: API Evangelist enhancements for Polyteia Platform API
  version: 1.0.0
extends: openapi/polyteia-platform-openapi.yml
actions:
  - target: $.info
    update:
      x-apievangelist-enriched: '2026-07-20'
      x-api-style: rpc
      x-authentication: authentication/polyteia-authentication.yml
      x-conventions: conventions/polyteia-conventions.yml
      x-errors: errors/polyteia-problem-types.yml
      x-data-model: data-model/polyteia-data-model.yml
  - target: $.info
    update:
      x-compliance:
        - GDPR
        - BSI IT-Grundschutz
        - BSI C5
        - ISO 27001 (in progress)
  - target: $.paths['/api'].post
    update:
      x-rpc-dispatch: body carries one of `command` or `query` plus `params`

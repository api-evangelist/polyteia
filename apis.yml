aid: polyteia
name: Polyteia
description: >-
  Polyteia is a Berlin-based govtech company offering a data platform for the
  German and European public sector. It lets public administrations connect
  existing systems, harmonize fragmented data, and use it in AI-supported
  workflows for forms, case processing, statistical evaluation, and reporting.
  The platform ships pre-built Solutions for common public-sector use cases
  (social-service planning, budget controlling, crisis response, kindergarten
  demand forecasting) plus a no-code/low-code Studio. It serves 80+ government
  entities in Germany, including the states of Schleswig-Holstein and Saarland.
  The platform is fully driveable through an RPC-style API (command/query over a
  single POST endpoint) authenticated with Personal Access Keys, backed by a
  Trust Center and GDPR/BSI/C5 compliance. Founded by Faruk Tuncer, Taisia
  Antonova, and Lukas Rambold; backed by HV Capital and DvH Ventures.
